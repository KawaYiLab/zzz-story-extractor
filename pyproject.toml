[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zzz-story-extractor"
version = "0.3.0"
description = "Extract Zenless Zone Zero main-story text with per-line speakers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pyooz>=0.0.8",
  "xxhash>=4.0",
  "cryptography>=42",
  "UnityPy>=1.25.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14,<1"]

[project.scripts]
zzz-story = "zzz_story.cli:main"

[tool.setuptools.packages.find]
include = ["zzz_story*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
