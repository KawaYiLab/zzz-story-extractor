[package]
name = "zzz-story-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server over the zzz-story-extractor corpus: story/lore search, reading and character tools for story-summarization agents."
license = "MIT"
publish = false

[features]
default = ["mimalloc"]
# mimalloc 需要 C 编译器；不方便时用 --no-default-features 回退到系统分配器。
mimalloc = ["dep:mimalloc"]

[dependencies]
anyhow = "1"
arc-swap = "1.7"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
memchr = "2.7"
mimalloc = { version = "0.1", optional = true }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "signal", "sync"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "limit", "timeout", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stderr = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# 性能剖析用：release 优化 + 符号。`cargo build --profile profiling`
[profile.profiling]
inherits = "release"
strip = "none"
debug = "line-tables-only"
panic = "unwind"
